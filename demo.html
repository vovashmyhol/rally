<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
body{background:linear-gradient(180deg,#00c6ff 0%,#0a8fff 36%,#0050ff 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60% 40% at 50% 0%,rgba(255,255,255,.28),transparent 70%),radial-gradient(50% 50% at 100% 100%,rgba(0,20,120,.45),transparent 70%)}
.stage{position:fixed;inset:0;overflow:hidden}

/* камера */
#cam{position:absolute;left:0;top:0;width:422px;height:872px;transform-origin:0 0;perspective:2400px;
  transition:transform 1.6s cubic-bezier(.5,0,.15,1);will-change:transform}
#tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.5,0,.15,1)}
.shadow{position:absolute;left:300px;top:70px;width:460px;height:800px;border-radius:70px;
  background:linear-gradient(90deg,rgba(0,25,130,.6),rgba(0,25,130,0));filter:blur(18px);
  transform:translateZ(-30px) skewY(9deg);transform-origin:left top;pointer-events:none}

/* корпус iPhone */
.phone{position:absolute;inset:0;border-radius:70px;
  background:linear-gradient(145deg,#9a9aa0 0%,#4a4a4f 28%,#8a8a90 52%,#35353a 78%,#6c6c72 100%);
  box-shadow:0 30px 80px rgba(0,20,100,.55),inset 0 0 0 1.5px rgba(255,255,255,.25)}
.bezel{position:absolute;inset:4px;border-radius:66px;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sb{position:absolute;width:5px;border-radius:3px;background:linear-gradient(90deg,#4d4d52,#8b8b91)}
.sb.l{left:-3px}.sb.r{right:-3px;background:linear-gradient(270deg,#4d4d52,#8b8b91)}
.screen{position:absolute;left:16px;top:16px;width:390px;height:844px;border-radius:54px;overflow:hidden;background:#000}
#app{display:block;width:390px;height:844px;border:0;background:#000;pointer-events:none}
.sbar{position:absolute;left:0;right:0;top:0;height:54px;z-index:5;pointer-events:none}
.tm{position:absolute;left:46px;top:17px;font-size:17px;font-weight:600;letter-spacing:.01em}
.ics{position:absolute;right:30px;top:19px;display:flex;align-items:center;gap:6px}
.bat{position:relative;width:26px;height:12.5px;border:1px solid rgba(255,255,255,.45);border-radius:4px;padding:1.5px}
.bat i{display:block;height:100%;width:78%;background:#fff;border-radius:2px}
.bat::after{content:"";position:absolute;right:-3.5px;top:3.5px;width:2px;height:4px;border-radius:0 2px 2px 0;background:rgba(255,255,255,.45)}
.isl{position:absolute;left:50%;top:11px;width:120px;height:35px;margin-left:-60px;border-radius:20px;background:#000;z-index:6}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(255,255,255,.92);z-index:6;pointer-events:none}
/* шапка Telegram в полноэкранном режиме */
.tgh{position:absolute;left:14px;right:14px;top:56px;height:40px;z-index:4;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.tgb{height:36px;padding:0 14px;display:flex;align-items:center;gap:6px;border-radius:999px;font-size:15px;font-weight:600;
  background:rgba(60,60,60,.62);-webkit-backdrop-filter:blur(8px) saturate(1.8);backdrop-filter:blur(8px) saturate(1.8);box-shadow:inset 0 0 8px rgba(255,255,255,.06)}
.tgb.more{width:36px;padding:0;justify-content:center;letter-spacing:1px}
.tgt{text-align:center;line-height:1.15}.tgt b{display:block;font-size:15px}.tgt small{font-size:11px;color:#9a9aa0}
.glare{position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:inherit;
  background:linear-gradient(112deg,transparent 30%,rgba(255,255,255,.07) 44%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.07) 56%,transparent 70%);
  background-size:260% 100%;background-position:130% 0;animation:sweep 7s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sweep{0%{background-position:130% 0}28%{background-position:-30% 0}100%{background-position:-30% 0}}

/* палец */
#dot{position:absolute;z-index:8;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.26);border:1.5px solid rgba(255,255,255,.55);box-shadow:0 0 22px rgba(255,255,255,.25);
  opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s cubic-bezier(.2,1.4,.4,1)}
#dot.on{opacity:1;transform:scale(1)}

/* подпись сверху */
#cap{position:fixed;left:0;right:0;top:3.2vh;text-align:center;z-index:20;pointer-events:none;opacity:0;transform:translateY(10px);
  transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.25,1)}
#cap.on{opacity:1;transform:none}
#cap span{display:inline-block;padding:9px 22px;border-radius:999px;font-size:clamp(16px,2.6vw,30px);font-weight:700;letter-spacing:-.01em;
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);
  box-shadow:inset 0 0 14px -3px rgba(255,255,255,.5),0 8px 30px rgba(0,30,130,.35);text-shadow:0 1px 10px rgba(0,40,140,.4)}
body.nocap #cap{display:none}
#hint{position:fixed;left:0;right:0;bottom:2vh;text-align:center;font-size:13px;color:rgba(255,255,255,.75);z-index:20;pointer-events:none;transition:opacity 1s}
#err{position:fixed;left:50%;top:50%;z-index:30;width:min(440px,88vw);transform:translate(-50%,-50%);padding:22px;border-radius:24px;display:none;
  background:rgba(10,20,60,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);font-size:15px;line-height:1.5;text-align:center}
#err code{background:rgba(255,255,255,.14);padding:2px 7px;border-radius:7px}
</style>
</head>
<body>
<div class="stage">
  <div id="cam">
    <div id="tilt">
      <div class="shadow"></div>
      <div class="phone">
        <i class="sb l" style="top:128px;height:30px"></i>
        <i class="sb l" style="top:190px;height:58px"></i>
        <i class="sb l" style="top:262px;height:58px"></i>
        <i class="sb r" style="top:220px;height:92px"></i>
        <div class="bezel"></div>
        <div class="screen">
          <iframe id="app" title="app"></iframe>
          <div class="sbar">
            <span class="tm">20:12</span>
            <span class="ics">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
              <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.2c2.4 0 4.6.9 6.3 2.5l1-1.1A10.4 10.4 0 0 0 8.5.7C5.7.7 3.2 1.8 1.2 3.6l1 1.1A8.9 8.9 0 0 1 8.5 2.2z"/><path d="M8.5 5.6c1.5 0 2.8.6 3.9 1.5l1-1.1a7.2 7.2 0 0 0-9.8 0l1 1.1c1.1-.9 2.4-1.5 3.9-1.5z"/><path d="M8.5 9c.7 0 1.3.3 1.8.7L8.5 11.8 6.7 9.7c.5-.4 1.1-.7 1.8-.7z"/></svg>
              <span class="bat"><i></i></span>
            </span>
          </div>
          <div class="isl"></div>
          <div class="tgh">
            <div class="tgb"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg>Закрыть</div>
            <div class="tgt"><b id="ttl"></b><small>мини-приложение</small></div>
            <div class="tgb more">•••</div>
          </div>
          <div id="dot"></div>
          <div class="glare"></div>
          <div class="home"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="cap"><span id="capt"></span></div>
<div id="hint">Пробел или клик — повторить · C — подписи · L — зацикливание</div>
<div id="err">Не могу управлять приложением внутри рамки.<br>Открой <code>demo.html</code> через сервер (там же, где лежит <code>index.html</code>, например GitHub Pages или <code>python -m http.server</code>), а не двойным кликом по файлу.</div>

<script>
// ====== настройки ======
const TITLE = 'Gifts Alert';          // название в шапке Telegram
const SRC = 'index.html';             // файл мини-аппа рядом с demo.html
const CAP = {
  intro: 'Мониторинг подарков по 4 маркетам',
  gift: 'Выбери подарок',
  price: 'Цена и диапазон номеров',
  model: 'Редкие модели',
  bg: 'Фон и узор',
  create: 'Создай оффер',
  alert: 'Алерт придёт, как только лот появится',
  learn: 'Инструкция внутри',
  settings: 'Liquid Glass переключатель',
  plus: 'Подписка Plus',
  lang: '5 языков',
  end: 'Liquid Glass в мини-аппе'
};
// =======================

const $ = id => document.getElementById(id);
const camEl = $('cam'), tiltEl = $('tilt'), fr = $('app'), dot = $('dot'), capEl = $('cap'), capT = $('capt');
$('ttl').textContent = TITLE;
const PW = 422, PH = 872, B = 16, CANCEL = 'cancel';
let D, W, gen = 0, fit = 1, lastCam = {}, loop = true;
if (/nocap/.test(location.search)) document.body.classList.add('nocap');

const layout = () => { fit = Math.min(innerHeight * .8 / PH, innerWidth * .9 / PW); };
layout();
const wait = ms => new Promise((res, rej) => { const my = gen; setTimeout(() => my === gen ? res() : rej(CANCEL), ms); });
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// ---- камера ----
function applyCam(o) {
  const s = (o.s || 1) * fit, px = (o.x == null ? PW / 2 - B : o.x) + B, py = (o.y == null ? PH / 2 - B : o.y) + B;
  const tx = innerWidth / 2 + (o.dx || 0), ty = innerHeight / 2 + innerHeight * .03 + (o.dy || 0);
  camEl.style.transform = `translate(${tx}px,${ty}px) scale(${s}) translate(${-px}px,${-py}px)`;
  tiltEl.style.transform = `rotateX(${o.rx || 0}deg) rotateY(${o.ry || 0}deg) rotateZ(${o.rz || 0}deg)`;
}
function cam(o = {}, ms = 1600) {
  lastCam = o;
  camEl.style.transitionDuration = tiltEl.style.transitionDuration = ms + 'ms';
  applyCam(o);
}
addEventListener('resize', () => { layout(); cam(lastCam, 0); });

// ---- подпись ----
let capTimer = 0;
function caption(text) {
  capEl.classList.remove('on'); clearTimeout(capTimer);
  capTimer = setTimeout(() => { capT.textContent = text; capEl.classList.add('on'); }, 260);
}

// ---- палец и события внутри приложения ----
const dotAt = p => { dot.style.left = p.x + 'px'; dot.style.top = p.y + 'px'; };
const dotOn = p => { dotAt(p); dot.classList.add('on'); };
const dotOff = () => dot.classList.remove('on');
const G = id => D.getElementById(id);
const ctr = e => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
const camOn = (e, s, extra = {}, ms) => { const c = ctr(e); cam({ x: c.x, y: c.y, s, ...extra }, ms); };
function fire(el, type, p) {
  el.dispatchEvent(new W.PointerEvent(type, { bubbles: true, cancelable: true, composed: true, clientX: p.x, clientY: p.y, pointerId: 7, pointerType: 'touch', isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1 }));
}
async function tap(e, o = {}) {
  const press = o.press !== false, c = ctr(e);
  dotOn(c);
  if (press) fire(e, 'pointerdown', c);
  await wait(o.hold || 170);
  if (press) fire(e, 'pointerup', c);
  e.click();
  await wait(90);
  dotOff();
}
async function drag(el, a, b, ms) {
  const steps = Math.max(10, Math.round(ms / 16));
  dotOn(a); fire(el, 'pointerdown', a);
  for (let i = 1; i <= steps; i++) {
    const e = ease(i / steps), p = { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e };
    fire(el, 'pointermove', p); dotAt(p);
    await wait(ms / steps);
  }
  fire(el, 'pointerup', b); await wait(60); dotOff();
}
async function waitFor(fn, to = 6000) {
  const t = Date.now();
  while (Date.now() - t < to) { try { const v = fn(); if (v) return v; } catch (e) {} await wait(120); }
  return null;
}
const listRows = () => [...D.querySelectorAll('#glist .mi:not(.dis)')];
const menuReady = () => { const m = G('gmenu'); return m.classList.contains('on') && !m.classList.contains('msgonly'); };
async function closeMenu() {
  const p = { x: 40, y: 770 }; dotOn(p); await wait(140);
  G('scrim').click(); await wait(80); dotOff(); await wait(450);
}
async function pickRows(btnId, idxs, s) {
  await tap(G(btnId));
  const rows = await waitFor(() => menuReady() && listRows().length > 3 ? listRows() : null);
  if (rows) {
    await wait(300); camOn(G('gmenu'), s, { rx: 2, ry: -5 }, 1300); await wait(900);
    for (const i of idxs) { await tap(rows[Math.min(i, rows.length - 1)], { press: false }); await wait(220); }
    await wait(500);
  }
  await closeMenu();
}

function loadApp() {
  return new Promise(res => {
    let done = false;
    fr.onload = () => {
      let h = ''; try { h = fr.contentWindow.location.href; } catch (_) {}
      if (done || h === 'about:blank') return;
      done = true;
      try {
        D = fr.contentDocument; W = fr.contentWindow;
        if (!D || !D.body) throw 0;
        // синтетические касания: без этого setPointerCapture падает на «ненастоящем» пальце
        W.Element.prototype.setPointerCapture = function () {};
        W.Element.prototype.releasePointerCapture = function () {};
        const st = D.createElement('style');
        // безопасные зоны как в полноэкранном мини-аппе: статус-бар + шапка Telegram, и «чёлка» снизу
        st.textContent = ':root{--top:100px!important;--bot:24px!important}';
        D.head.appendChild(st);
        res(true);
      } catch (e) { res(false); }
    };
    fr.src = SRC + '?d=' + Date.now();
  });
}

async function run() {
  const my = ++gen;
  clearTimeout(capTimer); capEl.classList.remove('on'); dotOff(); $('err').style.display = 'none';
  // старт: телефон ниже кадра и под наклоном
  camEl.style.transition = tiltEl.style.transition = 'none';
  applyCam({ s: .8, dy: innerHeight * .6, rx: 30, ry: -14 });
  void camEl.offsetWidth;
  camEl.style.transition = tiltEl.style.transition = '';
  const ok = await loadApp();
  if (my !== gen) return;
  if (!ok) { $('err').style.display = 'block'; return; }
  try {
    await wait(1500);

    // 0. интро
    caption(CAP.intro);
    cam({ s: 1, rx: 4, ry: -7 }, 2400); await wait(3000);

    // 1. выбор подарка
    caption(CAP.gift);
    cam({ x: 195, y: 190, s: 1.8, rx: 3, ry: -5 }, 1700); await wait(1200);
    await tap(G('gp'));
    let picked = false;
    const rows = await waitFor(() => menuReady() && listRows().length > 2 ? listRows() : null);
    if (rows) {
      await wait(300); camOn(G('gmenu'), 1.3, { rx: 2, ry: -4 }, 1400); await wait(800);
      const target = rows.find(r => (r.querySelector('.mt') || {}).textContent === 'Plush Pepe') || rows[Math.min(6, rows.length - 1)];
      const sc = G('gscr'), gl = G('glist');
      sc.scrollTo({ top: Math.max(0, gl.offsetTop + target.offsetTop - (sc.clientHeight - target.offsetHeight) / 2), behavior: 'smooth' });
      await wait(1300);
      await tap(target, { press: false }); picked = true;
      await wait(500);
      await wait(300);
    } else { await closeMenu(); }

    // 2. цена и номер
    caption(CAP.price);
    cam({ x: 195, y: 170, s: 1.8, rx: 3, ry: -5 }, 1300); await wait(900);
    await tap(G('fb0')); await wait(600);
    camOn(G('gmenu'), 1.9, { rx: 2, ry: -5 }, 1400); await wait(900);
    const prs = G('prs'), r = prs.getBoundingClientRect(), y = r.top + r.height / 2, X = t => r.left + 17 + (r.width - 34) * t;
    await drag(prs, { x: X(1), y }, { x: X(.55), y }, 1300); await wait(250);
    await drag(prs, { x: X(0), y }, { x: X(.14), y }, 900); await wait(500);
    await closeMenu();

    // 3. модель
    if (picked) {
      caption(CAP.model);
      cam({ x: 195, y: 170, s: 1.8, rx: 3, ry: -5 }, 1300); await wait(800);
      await pickRows('fb1', [1, 3], 1.45);
      // 4. фон
      caption(CAP.bg);
      await wait(300);
      await pickRows('fb2', [2, 6], 1.45);
    }

    // 5. создать оффер
    if (picked) {
      caption(CAP.create);
      const oc = G('ocreate');
      camOn(oc, 1.7, { rx: -3, ry: -5 }, 1600); await wait(1700);
      await tap(oc, { press: false }); await wait(600);
      camOn(G('osheet'), 1.6, { rx: -2, ry: 4 }, 1400); await wait(1500);
      await tap(G('omake'), { press: false }); await wait(800);
      const card = D.querySelector('#olist .oc');
      if (card) { caption(CAP.alert); camOn(card, 2, { rx: 3, ry: -6 }, 1700); await wait(2600); }
    }

    // 6. инструкция
    caption(CAP.learn);
    camOn(G('search'), 2.4, { rx: -4, ry: -9 }, 1500); await wait(1500);
    await tap(G('search')); await wait(600);
    camOn(G('lsheet'), 1.5, { rx: -2, ry: 3 }, 1400); await wait(2800);
    await tap(G('lokBtn'), { press: false }); await wait(800);

    // 7. Liquid Glass переключатель → настройки
    caption(CAP.settings);
    const tabs = [...D.querySelectorAll('#tabs .tab')];
    camOn(G('bar'), 1.9, { rx: -6, ry: 7 }, 1500); await wait(1600);
    await drag(G('bar'), ctr(tabs[0]), ctr(tabs[1]), 950); await wait(1100);

    // 8. Plus
    caption(CAP.plus);
    cam({ x: 195, y: 260, s: 1.35, rx: 2, ry: -5 }, 1600); await wait(1500);
    const pc = G('plusCard');
    camOn(pc, 1.7, { ry: -5 }, 1500); await wait(1500);
    await tap(G('plusBuyBtn'), { press: false }); await wait(2000);

    // 9. языки
    caption(CAP.lang);
    camOn(G('search'), 2.2, { rx: -4, ry: -9 }, 1500); await wait(1400);
    for (const lg of ['ko', 'ru']) {
      await tap(G('search')); await wait(750);
      const m = G('lmenu'), it = D.querySelector('#lmenu [data-lang="' + lg + '"]');
      camOn(m, 2, { ry: -6 }, 800); await wait(600);
      const c = ctr(it); dotOn(c); await wait(350);
      fire(m, 'pointerup', c); await wait(200); dotOff(); await wait(1300);
      camOn(G('search'), 2.2, { rx: -4, ry: -9 }, 900); await wait(1000);
    }

    // 10. назад на «Подарки» и финал
    camOn(G('bar'), 1.9, { rx: -6, ry: 7 }, 1300); await wait(1300);
    await drag(G('bar'), ctr(tabs[1]), ctr(tabs[0]), 950); await wait(900);
    caption(CAP.end);
    cam({ s: .95, rx: 9, ry: -17, rz: -1.5 }, 3200); await wait(4600);
    capEl.classList.remove('on'); await wait(1200);
    if (loop) run();
  } catch (e) { if (e !== CANCEL) console.error(e); }
}

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); run(); }
  if (e.key === 'c' || e.key === 'C' || e.key === 'с' || e.key === 'С') document.body.classList.toggle('nocap');
  if (e.key === 'l' || e.key === 'L' || e.key === 'д' || e.key === 'Д') loop = !loop;
});
addEventListener('click', () => run());
setTimeout(() => { $('hint').style.opacity = 0; }, 5000);
run();
</script>
</body>
</html>
