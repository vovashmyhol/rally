const CUR=[

const ALIAS={

const STOP=new Set(['в','на','to','in','into','=','->','→','➔','>','и','за','сколько','будет']);

const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({from:'DKK',to:'UAH',amount:'10',rbase:'UAH',ramount:'100',favs:['GBP','CHF'],pins:[],hist:[]},store.get('s',{}));

let rates=null,updated=0,stale=false;

/* ---------- Курсы ---------- */
async function getJSON(url){
  const ac=new AbortController();const t=setTimeout(()=>ac.abort(),8000);
  try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}
}
function fixRates(){if(!rates)return;rates.XTR=1000/13; /* Stars: 1000 ⭐ = 13 $ */
  if(rates.TON&&!rates.GRAM)rates.GRAM=rates.TON}
async function loadRates(force){
  rates={USD:1,EUR:.92,UAH:41.2,DKK:6.87,PLN:3.72,GBP:.78,RUB:92,CHF:.88,CZK:23.4,SEK:10.6,NOK:10.8,KZT:500,TRY:34,CNY:7.2,JPY:150,CAD:1.37,AUD:1.52,AED:3.67,GEL:2.7,BYN:3.3,MDL:17.7,RON:4.6,HUF:360,BGN:1.8,ILS:3.7,INR:83,KRW:1340,THB:35,GRAM:.45};fixRates();updated=new Date().setHours(9,41,0,0);stale=false;return;
  const cache=store.get('rates',null);
  if(!force&&cache&&Date.now()-cache.t<30*60*1000){rates=cache.r;fixRates();updated=cache.t;stale=false;return}
  $('status').classList.add('loading');
  let r=null;
  try{const d=await getJSON('https://open.er-api.com/v6/latest/USD');if(d&&d.rates)r=d.rates}catch(e){}
  if(!r){try{const d=await getJSON('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
    r={};for(const k in d.usd)r[k.toUpperCase()]=d.usd[k]}catch(e){}}
  if(r){
    try{const g=await getJSON('https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd');
      const p=g['the-open-network'].usd;if(p>0)r.GRAM=1/p}catch(e){if(cache&&(cache.r.GRAM||cache.r.TON))r.GRAM=cache.r.GRAM||cache.r.TON}
    rates=r;updated=Date.now();stale=false;store.set('rates',{t:updated,r});
  }else if(cache){rates=cache.r;updated=cache.t;stale=true}
  fixRates();
  $('status').classList.remove('loading');
}
const has=c=>rates&&rates[c]>0;
const conv=(v,f,t)=>v/rates[f]*rates[t];

/* ---------- Утилиты ---------- */
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const fmt=n=>{if(!isFinite(n))return '—';const a=Math.abs(n);
  return new Intl.NumberFormat('en-US',a>=1?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:a>=0.01?4:6}).format(n)};
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),1600)}
const cur=c=>META[c]||{f:'🏳️',n:c,s:c};

/* ---------- Рендер ---------- */
function setStatus(){
  const el=$('status');
  if(!rates){el.textContent='No data. Check your connection';el.className='err';return}
  const t=new Date(updated).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  el.className=stale?'err':'';
  el.textContent=stale?`Offline — rates from ${t}`:`Updated at ${t}`;
}
function renderConv(){
  const f=cur(S.from),t=cur(S.to);
  $('f-from').innerHTML=f.f;$('c-from').textContent=S.from;$('s-from').textContent=f.s;$('n-from').textContent=f.n;
  $('f-to').innerHTML=t.f;$('c-to').textContent=S.to;$('s-to').textContent=t.s;$('n-to').textContent=t.n;
  if(document.activeElement!==$('amt'))$('amt').value=S.amount;
  if(has(S.from)&&has(S.to)){
    $('res').textContent=fmt(conv(num(S.amount),S.from,S.to));
    $('rate-text').innerHTML=`1 ${S.from} = ${fmt(conv(1,S.from,S.to))} ${S.to}<br>1 ${S.to} = ${fmt(conv(1,S.to,S.from))} ${S.from}`;
  }else{$('res').textContent='—';$('rate-text').textContent=rates?'Rate unavailable':'Waiting for rates…'}
  const favs=S.favs.filter(c=>c!==S.from&&has(c));
  $('preview').innerHTML=favs.length?favs.map(c=>{const m=cur(c);
    return `<button class="item" data-to="${c}"><span class="flag">${m.f}</span><span class="grow"><b>${c}</b><small>${m.n}</small></span><span class="val">${has(S.from)?fmt(conv(num(S.amount),S.from,c)):'—'} ${m.s}</span></button>`}).join('')
    :'<div class="empty">Tap ♥ on currencies in the “All rates” tab</div>';
}
/* ---------- Недавние конвертации ---------- */
const histView=()=>(S.hist||[]).filter(h=>has(h.f)&&has(h.t));
function renderHist(){
  const w=$('hist-wrap'),l=histView();

    l.map((h,i)=>`<button class="item" data-h="${i}"><span class="grow"><b>${fmt(num(h.a))} ${h.f}</b><small>→ ${h.t}</small></span><span class="val">${fmt(conv(num(h.a),h.f,h.t))} ${cur(h.t).s}</span></button>`).join('')+'</div>';
}
let hT;const histSoon=()=>{clearTimeout(hT);hT=setTimeout(pushHist,1500)};
function pushHist(){
  const a=num(S.amount);if(!a||!has(S.from)||!has(S.to))return;
  S.hist=(S.hist||[]).filter(x=>!(x.f===S.from&&x.t===S.to&&num(x.a)===a));
  S.hist.unshift({f:S.from,t:S.to,a:S.amount});S.hist=S.hist.slice(0,6);save();renderHist();
}
function renderRates(){
  const f=cur(S.rbase);
  $('f-rb').innerHTML=f.f;$('c-rb').textContent=S.rbase;
  if(document.activeElement!==$('r-amt'))$('r-amt').value=S.ramount;

  list.sort((a,b)=>(S.favs.includes(b)-S.favs.includes(a)));
  const a=num(S.ramount);
  $('rates-list').innerHTML=has(S.rbase)&&list.length?list.map(c=>{const m=cur(c),on=S.favs.includes(c);

    <span class="val">${fmt(conv(a,S.rbase,c))} ${m.s}<small>1 ${S.rbase} = ${fmt(conv(1,S.rbase,c))}</small></span></button></div>`}).join('')
    :`<div class="empty">${rates?'Nothing found':'Rates not loaded'}</div>`;
}
const render=()=>{setStatus();renderConv();renderRates();renderHist()};

/* ---------- Умный ввод ---------- */
function parse(text){
  let s=text.toLowerCase().replace(/[$€₴₽₸₺£₾💎⭐★]/g,m=>` ${m} `).replace(/(\d)\s*([a-zа-я])/g,'$1 $2');
  const m=s.match(/\d+(?:[.,]\d+)?/);if(!m)return null;
  const amount=m[0].replace(',','.');
  const toks=s.replace(m[0],' ').split(/[\s,;]+/).filter(x=>x&&!STOP.has(x));
  const codes=[];toks.forEach(x=>{const c=ALIAS[x];if(c&&codes[codes.length-1]!==c)codes.push(c)});
  if(!codes.length)return null;
  return {amount,from:codes[0],to:codes[1]||null};
}

}

  try{await navigator.clipboard.writeText(txt)}catch(e){

<script>
const $=s=>document.querySelector(s),S=Math.max(.3,+new URLSearchParams(location.search).get('slow')||1);
document.documentElement.style.setProperty('--s',S);
const sleep=ms=>new Promise(r=>setTimeout(r,ms*S));
function kin(el,text,bot){el.innerHTML=[...text].map((c,i)=>`<span style="--i:${i}">${c===' '?'&nbsp;':c}</span>`).join('');el.className='kin'+(bot?' bot':'');void el.offsetWidth;el.classList.add('on')}
const hide=el=>{el.classList.add('out');el.classList.remove('on')};
const cam=(x,y,s,rx,ry,rz,d=2.4)=>{const e=$('#cam');e.style.transitionDuration=d*S+'s';e.style.transform=`perspective(170cqw) translate3d(${x}cqw,${y}cqw,0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;return sleep(d*850)};
const fr=$('#app'),K=()=>$('#phone').clientWidth/390,fit=()=>{fr.style.transform=`scale(${K()})`};
addEventListener('resize',fit);
const D=()=>fr.contentDocument,Q=s=>D().querySelector(s);
function setVal(el,v){el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}))}
/* касание: появляется ровно в нужной точке, в момент нажатия */
async function tap(el,hold=0,down,up,fx=.5){
  const r=el.getBoundingClientRect(),t=$('#touch'),k=K();
  t.style.transition='none';t.className='';
  t.style.setProperty('--x',(r.left+r.width*fx)*k+'px');t.style.setProperty('--y',(r.top+r.height/2)*k+'px');
  void t.offsetWidth;t.style.transition='';
  t.classList.add('on');await sleep(520);
  t.classList.add('dn');if(down)down();
  if(hold){t.style.setProperty('--h',hold*S+'ms');t.classList.add('hold')}
  await sleep(hold||240);(up||(()=>el.click()))();
  t.classList.remove('dn','hold');await sleep(180);t.classList.remove('on');await sleep(350);
}
const ptr=(el,type)=>{const r=el.getBoundingClientRect(),W=fr.contentWindow;el.dispatchEvent(new W.PointerEvent(type,{bubbles:true,pointerId:1,pointerType:'touch',clientX:r.left+r.width/2,clientY:r.top+r.height/2}))};
async function main(){
  const cm=$('#cam'),t1=$('#t1'),t2=$('#t2'),t3=$('#t3');
  fr.srcdoc=$('#appsrc').textContent.replace(/<\\\/script>/g,'<'+'/script>');
  await new Promise(r=>fr.onload=r);fit();
  cm.style.opacity=0;cam(0,34,.78,38,-14,-8,.01);
  await sleep(700);kin(t1,'Exchange rates');await sleep(1000);kin(t3,'TELEGRAM MINI APP');$('#glow').classList.add('on');await sleep(3000);
  hide(t1);hide(t3);await sleep(1300);
  cm.style.opacity=1;$('#phone').classList.add('sweep');await cam(0,0,1.02,0,0,0,3.4);await sleep(700);
  /* 1. ввод суммы */
  kin(t2,'Type an amount');cam(0,4,1.2,0,0,0,2.8);await sleep(1400);
  const amt=Q('#amt');amt.focus();
  for(const v of ['1','10','100','1000']){setVal(amt,v);await sleep(900)}
  amt.blur();await sleep(600);
  /* 2. умный ввод */
  hide(t2);await sleep(500);kin(t2,'Smart input',1);await cam(0,-16,1.2,0,0,0,2.6);
  const sm=Q('#smart');sm.focus();
  for(const ch of '1000 stars to $'){setVal(sm,sm.value+ch);await sleep(140)}
  await sleep(2600);sm.blur();
  /* 3. обмен местами */
  hide(t2);await sleep(400);kin(t2,'One tap to flip');await cam(0,4,1.2,0,0,0,2.4);
  await tap(Q('#swap'));await sleep(2500);
  /* 4. избранное и история: листаем вниз */
  hide(t2);await sleep(400);kin(t2,'Favorites & history');await cam(0,0,1.04,0,0,0,2.4);
  Q('main').scrollTo({top:420,behavior:'smooth'});await sleep(3200);Q('main').scrollTo({top:0,behavior:'smooth'});await sleep(1600);
  /* 5. все курсы */
  hide(t2);await sleep(400);kin(t2,'All rates at a glance',1);await cam(0,-20,1.2,0,0,0,2.6);
  await tap(Q('nav button[data-tab="tab-rates"]'));await sleep(1400);await cam(0,2,1.12,0,0,0,2.4);
  hide(t2);await sleep(500);kin(t2,'Favorites in one tap');
  for(const c of ['USD','EUR','PLN']){await tap(Q(`[data-star="${c}"]`));await sleep(300)}
  await sleep(1200);
  /* 6. закрепление долгим нажатием */
  hide(t2);await sleep(400);kin(t2,'Pin your currencies');await cam(0,4,1.12,0,0,0,2.4);
  await tap(Q('#sel-rbase'));await sleep(1700);
  const pln=Q('#m-list [data-c="PLN"]');
  await tap(pln,1500,()=>ptr(pln,'pointerdown'),()=>ptr(pln,'pointerup'),.3);
  await sleep(2600);Q('#m-close').click();hide(t2);await sleep(1200);
  /* финал */
  cam(0,2,.8,14,24,5,3.6);await sleep(1800);kin(t1,'Exchanger');await sleep(1100);kin(t3,'FAST · BEAUTIFUL · IN TELEGRAM');await sleep(4200);
  $('#fade').classList.add('on');await sleep(2600);$('#again').classList.add('on');
}
/* particles */
(()=>{const c=$('#fx'),x=c.getContext('2d'),d=devicePixelRatio||1;let W,H,P=[];
 const fit2=()=>{W=c.width=c.clientWidth*d;H=c.height=c.clientHeight*d};fit2();addEventListener('resize',fit2);
 for(let i=0;i<45;i++)P.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,v:.00008+Math.random()*.0002,a:Math.random()*6.3});
 (function f(){x.clearRect(0,0,W,H);for(const p of P){p.y-=p.v;p.a+=.01;if(p.y<-.02)p.y=1.02;x.fillStyle=`rgba(150,235,248,${.12+.2*Math.abs(Math.sin(p.a))})`;x.beginPath();x.arc(p.x*W,p.y*H,p.r*d,0,6.3);x.fill()}requestAnimationFrame(f)})()})();
let go=false;const start=()=>{if(go)return;go=true;$('#start').remove();main()};
addEventListener('pointerup',start);
$('#again').addEventListener('pointerup',()=>{location.hash='now';location.reload()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(k==='r'){location.hash='go';location.reload()}if(k===' ')start()});
if(location.hash==='#now'){$('#start').remove();go=true;setTimeout(main,300)}
if(location.hash==='#go'){$('#start').remove();go=true;setTimeout(main,2000)}
</script></body></html>
